# Experiment: Llama-3.2-1B + arXiv 2026 papers
# Paper-faithful reproduction with cross-domain knowledge corpus

experiment:
  name: "llama_3_2_1b__arxiv_2026"
  model: !include ../models/llama_3_2_1b.yaml
  data:
    name: "arxiv_2026"
    path: "./data/arxiv_2026"
  teacher:
    type: "local"
    model: "Qwen3.5-4B"
  expert:
    r: 4          # paper default (§A.5)
    alpha: 16     # paper default
    dropout: 0.05
    epochs: 3
    lr: 2e-4
    batch_size: 4
    max_length: 512
  router:
    tau: 0.7
    top_k: 3
    cooldown: 10
    bm25_k1: 1.5
    bm25_b: 0.75
  inference:
    max_new_tokens: 128
    temperature: 0.0
  training:
    backend: "modal"
    gpu: "T4"
    timeout: 600
  seed: 42
  output_dir: "./outputs/llama_3_2_1b__arxiv_2026"
