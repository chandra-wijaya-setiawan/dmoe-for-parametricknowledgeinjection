[project]
name = "dmoe"
version = "0.1.0"
description = "Decoupled Mixture-of-Experts for Parametric Knowledge Injection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "transformers>=4.45",
    "peft>=0.12",
    "accelerate>=0.34",
    "datasets>=3.0",
    "trl>=0.11",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "modal>=1.5.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
dmoe-prepare = "dmoe.scripts.prepare_data:main"
dmoe-train = "dmoe.scripts.train_experts_local:main"
dmoe-infer = "dmoe.scripts.run_inference:main"
dmoe-evaluate = "dmoe.scripts.evaluate:main"
dmoe-experiment = "dmoe.scripts.run_experiment:main"

[tool.pytest.ini_options]
rootdir = "."
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmoe"]

[tool.ruff]
line-length = 100
target-version = "py311"
